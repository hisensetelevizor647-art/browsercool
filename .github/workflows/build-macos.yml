name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example: 1.0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: Source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Source/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Resolve build version
        id: vars
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure macOS icon
        run: |
          if [ ! -f "Olewser LOGO/main.icns" ]; then
            if [ -f "Olewser LOGO/main-1024.png" ]; then
              npx electron-builder icon --format icns --input "Olewser LOGO/main-1024.png" --out "Olewser LOGO"
            else
              npx electron-builder icon --format icns --input "Olewser LOGO/main.png" --out "Olewser LOGO"
            fi
            cp "Olewser LOGO/icon.icns" "Olewser LOGO/main.icns"
          fi

      - name: Build macOS app
        run: |
          npx electron-builder --mac dmg zip \
            --config macos-package/electron-builder.mac.yml \
            --config.extraMetadata.version=${{ steps.vars.outputs.build_version }} \
            --config.npmRebuild=false \
            --config.forceCodeSigning=false \
            --config.mac.identity=null

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-${{ steps.vars.outputs.build_version }}
          path: |
            Source/dist/*.dmg
            Source/dist/*.zip
          if-no-files-found: error

      - name: Publish release assets
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.vars.outputs.build_version }}
          name: Olewser macOS v${{ steps.vars.outputs.build_version }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          artifacts: |
            Source/dist/*.dmg
            Source/dist/*.zip
