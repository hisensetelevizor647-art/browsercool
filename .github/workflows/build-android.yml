name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - publish-main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare versioned APK filename
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "Olewser-v${APP_VERSION}-github.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Olewser-v${{ env.APP_VERSION }}-github
          path: android/Olewser-v${{ env.APP_VERSION }}-github.apk
