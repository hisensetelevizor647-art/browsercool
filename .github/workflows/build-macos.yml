name: Build macOS

on:
  push:
    branches: [ main, publish-main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example: 1.0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Source/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Resolve build version
        id: vars
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure macOS icon
        run: |
          if [ ! -f "Olewser LOGO/main.icns" ]; then
            if [ -f "Olewser LOGO/main-1024.png" ]; then
              npx electron-builder icon --format icns --input "Olewser LOGO/main-1024.png" --out "Olewser LOGO"
            else
              npx electron-builder icon --format icns --input "Olewser LOGO/main.png" --out "Olewser LOGO"
            fi
            cp "Olewser LOGO/icon.icns" "Olewser LOGO/main.icns"
          fi

      - name: Prepare signing/notarization context
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          has_signing=true
          has_notarization=true

          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            has_signing=false
          fi

          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            has_notarization=false
          fi

          if [ "$has_notarization" = "true" ]; then
            mkdir -p .secrets
            key_file=".secrets/AuthKey_${APPLE_API_KEY_ID}.p8"

            if [[ "${APPLE_API_KEY}" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s' "${APPLE_API_KEY}" > "${key_file}"
            elif [[ "${APPLE_API_KEY}" == *.p8 ]] && [ -f "${APPLE_API_KEY}" ]; then
              key_file="${APPLE_API_KEY}"
            else
              # Assume base64-encoded .p8 payload
              printf '%s' "${APPLE_API_KEY}" | base64 --decode > "${key_file}"
            fi

            echo "APPLE_API_KEY=${PWD}/${key_file}" >> "$GITHUB_ENV"
          fi

          if [ "$has_signing" != "true" ] || [ "$has_notarization" != "true" ]; then
            echo "::warning::Signing/notarization secrets are missing. Unsigned build will be produced and macOS can show security warnings."
          fi

          echo "has_signing=${has_signing}" >> "$GITHUB_OUTPUT"
          echo "has_notarization=${has_notarization}" >> "$GITHUB_OUTPUT"

      - name: Build macOS app (signed + notarized)
        if: ${{ steps.signing.outputs.has_signing == 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac dmg zip --arm64 --x64 \
            --config macos-package/electron-builder.mac.yml \
            --config.extraMetadata.version=${{ steps.vars.outputs.build_version }} \
            --config.npmRebuild=false

      - name: Build macOS app (unsigned fallback)
        if: ${{ steps.signing.outputs.has_signing != 'true' }}
        run: |
          npx electron-builder --mac dmg zip --arm64 --x64 \
            --config macos-package/electron-builder.mac.yml \
            --config.extraMetadata.version=${{ steps.vars.outputs.build_version }} \
            --config.npmRebuild=false \
            --config.forceCodeSigning=false \
            --config.mac.identity=null

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-${{ steps.vars.outputs.build_version }}
          path: |
            Source/dist-macos/*.dmg
            Source/dist-macos/*.zip
          if-no-files-found: error

      - name: Generate update manifest bundle
        run: |
          node macos-package/scripts/build-update-manifest.mjs "${{ steps.vars.outputs.build_version }}" \
            --mac-arm "Olewser-macos-${{ steps.vars.outputs.build_version }}-arm64.dmg" \
            --mac-x64 "Olewser-macos-${{ steps.vars.outputs.build_version }}-x64.dmg" \
            --out "dist-macos/app-update.json"

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: app-update-json-${{ steps.vars.outputs.build_version }}
          path: Source/dist-macos/app-update.json
          if-no-files-found: error

      - name: Publish release assets
        if: ${{ steps.signing.outputs.has_signing == 'true' && steps.signing.outputs.has_notarization == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.vars.outputs.build_version }}
          name: Olewser macOS v${{ steps.vars.outputs.build_version }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          artifacts: |
            Source/dist-macos/*.dmg
            Source/dist-macos/*.zip
            Source/dist-macos/app-update.json
