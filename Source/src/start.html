<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olewser - Welcome</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: rgba(255,255,255,0.06);
            --panel-border: rgba(255,255,255,0.14);
            --text: #ffffff;
            --muted: #b8b8b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: var(--text);
            background:
                radial-gradient(700px 400px at 10% 10%, rgba(22,163,74,0.22), transparent 60%),
                radial-gradient(600px 350px at 90% 90%, rgba(14,165,233,0.18), transparent 60%),
                var(--bg);
            padding: 20px;
        }
        .card {
            width: min(560px, 100%);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.35);
        }
        .logo {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--muted);
            margin-bottom: 22px;
            line-height: 1.45;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .lang-btn {
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.04);
            color: #fff;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }
        .lang-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.08); }
        .lang-btn.active {
            background: #fff;
            color: #111;
            border-color: #fff;
        }
        .start-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            background: #fff;
            color: #111;
        }
        .start-btn:disabled { opacity: .7; cursor: default; }
        .note {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="logo">OLEWSER</h1>
        <p class="subtitle" id="subtitle">Vyberte jazyk aplikácie.</p>

        <div class="grid">
            <button class="lang-btn" id="lang-sk" type="button" onclick="setLang('sk')">Slovenčina</button>
            <button class="lang-btn" id="lang-uk" type="button" onclick="setLang('uk')">Українська</button>
            <button class="lang-btn" id="lang-en" type="button" onclick="setLang('en')">English</button>
            <button class="lang-btn" id="lang-ru" type="button" onclick="setLang('ru')">Русский</button>
        </div>

        <button class="start-btn" id="start-btn" type="button" onclick="finish()">Pokračovať</button>
        <div class="note" id="note">Táto obrazovka sa zobrazí iba pri prvom spustení.</div>
    </main>

    <script>
        let currentLang = 'sk';

        const i18n = {
            sk: {
                subtitle: 'Vyberte jazyk aplikácie.',
                start: 'Pokračovať',
                note: 'Táto obrazovka sa zobrazí iba pri prvom spustení.'
            },
            uk: {
                subtitle: 'Оберіть мову застосунку.',
                start: 'Продовжити',
                note: 'Цей екран показується лише під час першого запуску.'
            },
            en: {
                subtitle: 'Choose app language.',
                start: 'Continue',
                note: 'This screen appears only on first launch.'
            },
            ru: {
                subtitle: 'Выберите язык приложения.',
                start: 'Продолжить',
                note: 'Этот экран показывается только при первом запуске.'
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn) => btn.classList.remove('active'));
            const btn = document.getElementById(`lang-${lang}`);
            if (btn) btn.classList.add('active');

            const t = i18n[lang] || i18n.sk;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('start-btn').textContent = t.start;
            document.getElementById('note').textContent = t.note;
        }

        setLang('sk');

        async function finish() {
            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = true;

            try {
                localStorage.setItem('language', currentLang);
                localStorage.setItem('languageSelected', 'true');

                if (window.olewser && window.olewser.settings) {
                    const settings = await window.olewser.settings.load();
                    settings.language = currentLang;
                    await window.olewser.settings.save(settings);
                }

                // First-run flow: language -> onboarding/import wizard -> main browser
                window.location.href = 'import.html?embedded=1';
            } catch (error) {
                console.error('Start screen failed:', error);
                startBtn.disabled = false;
                alert('Failed to save language. Try again.');
            }
        }
    </script>
</body>
</html>
